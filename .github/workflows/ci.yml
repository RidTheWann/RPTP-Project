# SPDX-License-Identifier: GPL-3.0-or-later
name: RPTP CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows x64 / MSVC
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure and verify with MSVC
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > "%TEMP%\rptp-vs-path.txt"
          if errorlevel 1 exit /b 1
          set /p VSINSTALL=<"%TEMP%\rptp-vs-path.txt"
          if not defined VSINSTALL (echo Visual Studio C++ tools not found & exit /b 1)
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          python tools\rptp_doctor.py
          if errorlevel 1 exit /b 1
          cmake --preset windows-msvc
          if errorlevel 1 exit /b 1
          cmake --build --preset windows-msvc

  linux-host:
    name: Linux / GCC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build g++
      - name: Configure and verify with host compiler
        run: |
          python tools/rptp_doctor.py
          cmake --preset host
          cmake --build --preset host
